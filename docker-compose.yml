services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weavia
      POSTGRES_USER: weavia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local Compose}
    ports:
      - '5432:5432'
    volumes:
      - weavia-postgres:/var/lib/postgresql/data
      - ./packages/database/drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weavia -d weavia']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ['migrate']
    environment: &backend-env
      DATABASE_URL: postgresql://weavia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/weavia?sslmode=disable
      APP_ENV: development
      DEMO_MODE: 'false'
      WEAVIA_WEB_ORIGIN: http://localhost:3000
      ENABLE_REAL_AI: 'false'
      ANTDIGITAL_BASE_URL: https://maas-api.antdigital.com/v1
      ANTDIGITAL_API_KEY: ${ANTDIGITAL_API_KEY:-}
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/api/v1
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_IMAGE_EDIT_MODEL: qwen-image-edit-plus
      ASSET_STORAGE_DIR: /app/var/assets
      STORAGE_SIGNING_KEY: ${STORAGE_SIGNING_KEY:?Set STORAGE_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment: *backend-env
    ports:
      - '8080:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/api/readiness']
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - weavia-assets:/app/var/assets
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ['worker']
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - weavia-assets:/app/var/assets
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/frontend.Dockerfile
      args:
        APP_NAME: '@weavia/web'
        PORT: 3000
        APP_DIR: apps/web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://47.113.148.107:8080}
        WEAVIA_BACKEND_URL: ${WEAVIA_BACKEND_URL:-http://backend:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://47.113.148.107:8080}
      WEAVIA_BACKEND_URL: ${WEAVIA_BACKEND_URL:-http://backend:8080}
      NODE_ENV: production
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/frontend.Dockerfile
      args:
        APP_NAME: '@weavia/admin'
        PORT: 3001
        APP_DIR: apps/admin
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://47.113.148.107:8080}
        WEAVIA_BACKEND_URL: ${WEAVIA_BACKEND_URL:-http://backend:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://47.113.148.107:8080}
      WEAVIA_BACKEND_URL: ${WEAVIA_BACKEND_URL:-http://backend:8080}
      NODE_ENV: production
    ports:
      - '3001:3001'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  weavia-postgres:
  weavia-assets:
