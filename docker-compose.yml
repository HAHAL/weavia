services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weavia
      POSTGRES_USER: weavia
      POSTGRES_PASSWORD: weavia
    ports:
      - '5432:5432'
    volumes:
      - weavia-postgres:/var/lib/postgresql/data
      - ./packages/database/drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weavia -d weavia']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ['migrate']
    environment: &backend-env
      DATABASE_URL: postgresql://weavia:weavia@postgres:5432/weavia?sslmode=disable
      WEAVIA_WEB_ORIGIN: http://localhost:3000
      ENABLE_REAL_AI: 'false'
      ANTDIGITAL_BASE_URL: https://maas-api.antdigital.com/v1
      ANTDIGITAL_API_KEY: ${ANTDIGITAL_API_KEY:-}
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/api/v1
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_IMAGE_EDIT_MODEL: qwen-image-edit-plus
      ASSET_STORAGE_DIR: /app/var/assets
      STORAGE_SIGNING_KEY: ${STORAGE_SIGNING_KEY:-weavia-development-only}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment: *backend-env
    ports:
      - '8080:8080'
    volumes:
      - weavia-assets:/app/var/assets
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ['worker']
    environment: *backend-env
    volumes:
      - weavia-assets:/app/var/assets
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  weavia-postgres:
  weavia-assets:
