version: "2"
sql:
  - engine: postgresql
    schema: internal/store/schema.sql
    queries: internal/store/queries.sql
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_json_tags: true
        overrides:
          - db_type: uuid
            go_type: string
