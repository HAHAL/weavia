[package]
name = "weavia"
version = "0.1.0"
description = "WEAVIA desktop application"
authors = ["WEAVIA"]
edition = "2021"

[lib]
name = "weavia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
